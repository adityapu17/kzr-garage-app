<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KZR Garage Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Clean scrollbar hiding for horizontal tabs */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen pb-12 antialiased">

  <!-- Minimalist Header -->
  <header class="bg-slate-900 border-b border-slate-800 p-4 sticky top-0 z-50">
    <div class="max-w-md mx-auto flex justify-between items-center">
      <div class="flex items-center gap-2">
        <div class="w-3 h-3 bg-orange-500 rounded-full"></div>
        <h1 class="text-base font-bold tracking-wide text-slate-100">KZR GARAGE</h1>
      </div>
      <span class="text-[11px] font-mono text-slate-400 bg-slate-800 px-2.5 py-1 rounded border border-slate-700">Vario 125 Old</span>
    </div>
  </header>

  <!-- Clean Navigation Bar -->
  <nav class="bg-slate-900 border-b border-slate-800 sticky top-[57px] z-40">
    <div class="max-w-md mx-auto flex overflow-x-auto text-xs no-scrollbar">
      <button onclick="switchTab('parts')" id="tab-parts" class="tab-btn flex-none py-3 px-4 font-medium text-orange-500 border-b-2 border-orange-500">Katalog Sparepart</button>
      <button onclick="switchTab('torque')" id="tab-torque" class="tab-btn flex-none py-3 px-4 font-medium text-slate-400">Torsi Baut</button>
      <button onclick="switchTab('logbook')" id="tab-logbook" class="tab-btn flex-none py-3 px-4 font-medium text-slate-400">Log Servis</button>
      <button onclick="switchTab('cvt')" id="tab-cvt" class="tab-btn flex-none py-3 px-4 font-medium text-slate-400">CVT Calculator</button>
      <button onclick="switchTab('engine')" id="tab-engine" class="tab-btn flex-none py-3 px-4 font-medium text-slate-400">Kalkulator CC</button>
      <button onclick="switchTab('mil')" id="tab-mil" class="tab-btn flex-none py-3 px-4 font-medium text-slate-400">Kode MIL</button>
      <button onclick="switchTab('wiring')" id="tab-wiring" class="tab-btn flex-none py-3 px-4 font-medium text-slate-400">Kelistrikan</button>
    </div>
  </nav>

  <!-- Main Content Area -->
  <main class="max-w-md mx-auto p-4 space-y-4">

    <!-- 1. SPAREPART CATALOG (LENGKAP & MODERN) -->
    <section id="sec-parts" class="tab-content space-y-3">
      <div class="flex justify-between items-center">
        <span id="partCount" class="text-xs font-mono text-slate-400"></span>
      </div>

      <!-- Search Input -->
      <div class="relative">
        <input type="text" id="partSearch" onkeyup="searchParts()" placeholder="Cari sparepart, kode, atau substitusi..." class="w-full p-3 bg-slate-900 border border-slate-800 rounded-xl text-xs text-slate-100 focus:outline-none focus:border-slate-600 transition">
      </div>

      <!-- Category Filter Pills -->
      <div class="flex gap-1.5 overflow-x-auto no-scrollbar pb-1 text-[11px]">
        <button onclick="filterPartCat('ALL')" class="cat-pill bg-slate-800 text-slate-200 px-3 py-1 rounded-lg border border-slate-700 font-medium shrink-0">Semua</button>
        <button onclick="filterPartCat('CVT')" class="cat-pill bg-slate-900 text-slate-400 px-3 py-1 rounded-lg border border-slate-800 shrink-0">CVT</button>
        <button onclick="filterPartCat('Mesin')" class="cat-pill bg-slate-900 text-slate-400 px-3 py-1 rounded-lg border border-slate-800 shrink-0">Mesin</button>
        <button onclick="filterPartCat('Bodi & Lampu')" class="cat-pill bg-slate-900 text-slate-400 px-3 py-1 rounded-lg border border-slate-800 shrink-0">Bodi & Lampu</button>
        <button onclick="filterPartCat('Kaki-kaki & Rem')" class="cat-pill bg-slate-900 text-slate-400 px-3 py-1 rounded-lg border border-slate-800 shrink-0">Kaki & Rem</button>
        <button onclick="filterPartCat('Sensors & FI')" class="cat-pill bg-slate-900 text-slate-400 px-3 py-1 rounded-lg border border-slate-800 shrink-0">Sensors & FI</button>
      </div>

      <div id="partsList" class="space-y-2.5"></div>
    </section>

    <!-- 2. TORQUE SPEC FINDER -->
    <section id="sec-torque" class="tab-content hidden space-y-3">
      <input type="text" id="torqueSearch" onkeyup="searchTorque()" placeholder="Cari baut: Pulley, Head, Magnet..." class="w-full p-3 bg-slate-900 border border-slate-800 rounded-xl text-xs text-slate-100 focus:outline-none focus:border-slate-600">
      <div id="torqueList" class="space-y-2"></div>
    </section>

    <!-- 3. LOGBOOK SERVIS -->
    <section id="sec-logbook" class="tab-content hidden space-y-4">
      <form onsubmit="saveLog(event)" class="bg-slate-900 p-4 rounded-xl space-y-3 border border-slate-800 text-xs">
        <div>
          <label class="text-slate-400 block mb-1">Jenis Servis / Penggantian Part</label>
          <input type="text" id="logTitle" required placeholder="Ganti Oli + Roller 15g" class="w-full p-2.5 bg-slate-950 border border-slate-800 rounded-lg text-slate-100">
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="text-slate-400 block mb-1">Odometer (KM)</label>
            <input type="number" id="logKm" required placeholder="35000" class="w-full p-2.5 bg-slate-950 border border-slate-800 rounded-lg text-slate-100">
          </div>
          <div>
            <label class="text-slate-400 block mb-1">Biaya (Rp)</label>
            <input type="number" id="logCost" placeholder="75000" class="w-full p-2.5 bg-slate-950 border border-slate-800 rounded-lg text-slate-100">
          </div>
        </div>
        <div>
          <label class="text-slate-400 block mb-1">Catatan Tambahan</label>
          <input type="text" id="logNote" placeholder="Pakai oli SPX2, mangkok ganda dikartel" class="w-full p-2.5 bg-slate-950 border border-slate-800 rounded-lg text-slate-100">
        </div>
        <button type="submit" class="w-full bg-slate-100 text-slate-900 font-semibold py-2.5 rounded-lg text-xs">Simpan Log</button>
      </form>

      <div class="flex justify-between items-center pt-2">
        <h3 class="text-xs font-semibold text-slate-400">Riwayat Catatan</h3>
        <button onclick="clearLogs()" class="text-[11px] text-red-400 hover:underline">Hapus Semua</button>
      </div>
      <div id="logList" class="space-y-2"></div>
    </section>

    <!-- 4. CVT CALCULATOR -->
    <section id="sec-cvt" class="tab-content hidden space-y-4">
      <div class="bg-slate-900 p-4 rounded-xl space-y-3 border border-slate-800 text-xs">
        <label class="text-slate-400 block">Berat Roller (6 Slot):</label>
        <div class="grid grid-cols-3 gap-2">
          <input type="number" id="r1" value="18" class="p-2 bg-slate-950 border border-slate-800 rounded text-center text-slate-100">
          <input type="number" id="r2" value="18" class="p-2 bg-slate-950 border border-slate-800 rounded text-center text-slate-100">
          <input type="number" id="r3" value="18" class="p-2 bg-slate-950 border border-slate-800 rounded text-center text-slate-100">
          <input type="number" id="r4" value="18" class="p-2 bg-slate-950 border border-slate-800 rounded text-center text-slate-100">
          <input type="number" id="r5" value="18" class="p-2 bg-slate-950 border border-slate-800 rounded text-center text-slate-100">
          <input type="number" id="r6" value="18" class="p-2 bg-slate-950 border border-slate-800 rounded text-center text-slate-100">
        </div>
        <div>
          <label class="text-slate-400 block mb-1">Per CVT:</label>
          <select id="perCvt" class="w-full p-2.5 bg-slate-950 border border-slate-800 rounded text-slate-100">
            <option value="1000">Standar KZR / 1000 RPM</option>
            <option value="1200">1200 RPM</option>
            <option value="1500">1500 RPM</option>
          </select>
        </div>
        <button onclick="calculateCVT()" class="w-full bg-slate-100 text-slate-900 font-semibold py-2.5 rounded-lg text-xs">Kalkulasi Karakter</button>
      </div>
      <div id="cvtResult" class="hidden bg-slate-900 p-4 rounded-xl border border-slate-800 space-y-2">
        <div class="flex justify-between items-center">
          <h3 class="font-bold text-orange-400 text-xs">Hasil Analisis</h3>
          <span id="avgRollerBadge" class="text-[10px] bg-slate-800 text-slate-300 px-2 py-0.5 rounded font-mono"></span>
        </div>
        <p id="cvtText" class="text-xs text-slate-300 leading-relaxed"></p>
      </div>
    </section>

    <!-- 5. ENGINE CALCULATOR -->
    <section id="sec-engine" class="tab-content hidden space-y-4">
      <div class="bg-slate-900 p-4 rounded-xl space-y-3 border border-slate-800 text-xs">
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="text-slate-400 block mb-1">Diameter Piston (mm)</label>
            <input type="number" step="0.1" id="engBore" value="52.4" class="w-full p-2.5 bg-slate-950 border border-slate-800 rounded text-slate-100">
          </div>
          <div>
            <label class="text-slate-400 block mb-1">Langkah / Stroke (mm)</label>
            <input type="number" step="0.1" id="engStroke" value="57.9" class="w-full p-2.5 bg-slate-950 border border-slate-800 rounded text-slate-100">
          </div>
        </div>
        <div>
          <label class="text-slate-400 block mb-1">Volume Head / Dome (cc)</label>
          <input type="number" step="0.1" id="engDome" value="11.5" class="w-full p-2.5 bg-slate-950 border border-slate-800 rounded text-slate-100">
        </div>
        <button onclick="calculateEngine()" class="w-full bg-slate-100 text-slate-900 font-semibold py-2.5 rounded-lg text-xs">Hitung Kapasitas & Kompresi</button>
      </div>

      <div id="engineResult" class="hidden bg-slate-900 p-4 rounded-xl border border-slate-800 space-y-3 text-xs">
        <div class="grid grid-cols-2 gap-2 text-center">
          <div class="bg-slate-950 p-2.5 rounded-lg border border-slate-800">
            <span class="text-slate-400 text-[10px]">Volume Mesin</span>
            <p id="resCc" class="text-base font-bold text-orange-400">124.8 cc</p>
          </div>
          <div class="bg-slate-950 p-2.5 rounded-lg border border-slate-800">
            <span class="text-slate-400 text-[10px]">Rasio Kompresi Statis</span>
            <p id="resComp" class="text-base font-bold text-orange-400">11.0 : 1</p>
          </div>
        </div>
        <p id="resFuelRec" class="text-[11px] text-slate-300 pt-1 border-t border-slate-800"></p>
      </div>
    </section>

    <!-- 6. MIL DECODER -->
    <section id="sec-mil" class="tab-content hidden space-y-3">
      <div class="bg-slate-900 p-4 rounded-xl space-y-3 border border-slate-800 text-xs">
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="text-slate-400 block mb-1">Kedip Panjang (10)</label>
            <input type="number" id="longBlink" value="0" min="0" class="w-full p-2.5 bg-slate-950 border border-slate-800 rounded text-slate-100">
          </div>
          <div>
            <label class="text-slate-400 block mb-1">Kedip Pendek (1)</label>
            <input type="number" id="shortBlink" value="0" min="0" class="w-full p-2.5 bg-slate-950 border border-slate-800 rounded text-slate-100">
          </div>
        </div>
        <button onclick="decodeMIL()" class="w-full bg-slate-100 text-slate-900 font-semibold py-2.5 rounded-lg text-xs">Diagnosa MIL</button>
      </div>
      <div id="milResult" class="hidden bg-slate-900 p-4 rounded-xl border border-slate-800 text-xs"></div>
    </section>

    <!-- 7. WIRING DIAGRAM -->
    <section id="sec-wiring" class="tab-content hidden space-y-3">
      <div id="wiringList" class="space-y-2"></div>
    </section>

  </main>

  <script src="app.js"></script>
</body>
</html>
